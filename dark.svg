    <circle cx="242" cy="315" r="118" fill="none" stroke="#22d3ee" stroke-opacity=".13"/><circle cx="242" cy="315" r="88" fill="none" stroke="#8b5cf6" stroke-opacity=".2" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0 242 315" to="360 242 315" dur="24s" repeatCount="indefinite"/></circle>
